title: Suspicious Child Process from Outlook (ICS Phishing)
id: a1a59dea-4b06-4beb-bc00-9b65ef3d3456
status: experimental
description: Detects Outlook spawning script interpreters or curl, indicative of a user opening a malicious calendar invite.
author: Alex Dumas
date: 2025-12-17
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\outlook.exe'
  suspicious_children:
    Image|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\curl.exe'
  condition: selection and suspicious_children
level: high
tags:
  - attack.initial-access
  - attack.t1566.001
